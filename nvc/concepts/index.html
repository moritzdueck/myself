<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <!-- Root-absolute on purpose: Vite rewrites these to sit under `--base` when
         the portfolio build runs, and an absolute path is the only kind that
         survives being loaded from a nested entry page (/nvc/practice/stay/). -->
    <link rel="icon" href="/nvc/favicon.ico" sizes="32x32"/>
    <link rel="icon" href="/nvc/icon.svg" type="image/svg+xml"/>
    <link rel="apple-touch-icon" href="/nvc/apple-touch-icon.png"/>
    <link rel="manifest" href="/nvc/site.webmanifest"/>

    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- Paper at rest; the story rewrites it as the room's colour travels, so a
         phone's own bars travel with it (see utils/themeColor.ts). -->
    <meta name="theme-color" content="#ffffff"/>
    <title>Nonviolent Communication</title>

    <!-- Link previews. `entryPages` in vite.config.ts writes the built
         index.html out at every entry route, so one set of tags covers
         /nvc/story and the rest — which is why `og:url` names the app rather
         than any single page inside it. Absolute URLs because a scraper
         resolves nothing, and a JPEG because most of them ignore SVG. -->
    <meta name="description"
          content="An introduction to Nonviolent Communication: an illustrated story of a conversation that goes wrong and then runs again another way, the ideas behind it, and a gym for practising the hard parts."/>

    <meta property="og:type" content="website"/>
    <meta property="og:url" content="https://www.moritzdueck.com/nvc/"/>
    <meta property="og:title" content="Nonviolent Communication"/>
    <meta property="og:description"
          content="An illustrated story of a conversation that goes wrong and then runs again another way, the ideas behind it, and a gym for practising the hard parts."/>
    <meta property="og:image" content="https://www.moritzdueck.com/nvc/og-image.jpg"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="630"/>
    <meta property="og:image:alt"
          content="A dialogue replayed the other way, with the giraffe and the jackal listening from either side"/>

    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="Nonviolent Communication"/>
    <meta name="twitter:description"
          content="An illustrated story of a conversation that goes wrong and then runs again another way, the ideas behind it, and a gym for practising the hard parts."/>
    <meta name="twitter:image" content="https://www.moritzdueck.com/nvc/og-image.jpg"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">

  <script type="module" crossorigin src="/nvc/assets/index-EvSZcRF1.js"></script>
  <link rel="stylesheet" crossorigin href="/nvc/assets/index-DKCITVVP.css">
</head>
<body>
<div id="app"></div>
</body>
</html>
